<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDSTEM 189 Portfolio · Gilberto Damian</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/png" href="/profile.jpg" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg:#0a0a0b;
    --fg:#f4f4f2;
    --fg-2:#a2a2a4;
    --line:rgba(255,255,255,0.09);
    --line-strong:rgba(255,255,255,0.18);
    --display:"Space Grotesk", system-ui, sans-serif;
    --body:"IBM Plex Sans", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--body);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  header{
    width:100%;
    max-width:900px;
    padding:clamp(1.5rem,5vw,3rem) 1.25rem 1rem;
    text-align:center;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:0.8rem;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--fg-2);
  }
  h1{
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(1.6rem,4vw,2.4rem);
    letter-spacing:-0.01em;
    margin:0.6rem 0 0.3rem;
  }
  p.byline{color:var(--fg-2);margin:0 0 1.2rem;font-size:0.95rem;}
  a.dl{
    font-family:var(--mono);
    font-size:0.8rem;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--fg);
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:0.7rem 1.2rem;
    text-decoration:none;
    display:inline-block;
    transition:background .2s ease,color .2s ease;
  }
  a.dl:hover{background:var(--fg);color:var(--bg);}
  .pdf-wrap{
    width:100%;
    max-width:900px;
    flex:1;
    padding:0 1.25rem 2rem;
  }
  embed{
    width:100%;
    height:82vh;
    border:1px solid var(--line);
    border-radius:4px;
    background:#1a1a1c;
  }
  @media (max-width:640px){
    embed{display:none;}
    .mobile-note{
      text-align:center;color:var(--fg-2);font-size:0.9rem;margin-top:2rem;
    }
  }
  .mobile-note{display:none;}
  @media (max-width:640px){ .mobile-note{display:block;} }
</style>
</head>
<body>

<header>
  <span class="eyebrow">CalTeach Program &middot; UC Berkeley</span>
  <h1>EDSTEM 189 Portfolio</h1>
  <p class="byline">Gilberto Damian &middot; Integrating Research Methods into K&ndash;12 Teaching in Mathematics and Science</p>
  <a class="dl" href="/edstem189portfolio/edstem189-portfolio.pdf" download>Download PDF</a>
</header>

<div class="pdf-wrap">
  <embed src="/edstem189portfolio/edstem189-portfolio.pdf" type="application/pdf" />
  <p class="mobile-note">Your browser preview may not display PDFs inline on mobile. Use the download button above to view the file.</p>
</div>

</body>
</html>
